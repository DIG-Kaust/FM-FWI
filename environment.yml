name: fmfwi
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - scipy
  - matplotlib
  - pip
  - ipython
  - jupyter
  - ipykernel
  # Nothing pip-installed here on purpose: torch and devito/devitofwi get
  # installed by install_env.sh, in an order that avoids a real failure we
  # hit putting them all in one conda-env-create pass: without a torch
  # already present, packages that depend on it can pull in whatever the
  # latest torch happens to be (wrong CUDA build) instead of the one
  # install_env.sh deliberately matches to the local GPU driver.
